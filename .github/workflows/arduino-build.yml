name: Arduino sketch compilation
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install board core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Install TinyGPSPlus library
        run: arduino-cli lib install TinyGPSPlus
      - name: Compile Arduino Uno example
        run: arduino-cli compile --fqbn arduino:avr:uno arduino/CarAccidentAlert
